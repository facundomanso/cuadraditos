<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadraditos</title>
<meta name="description" content="Registrá cómo te levantás, qué hiciste y cómo fue tu día. Cada día es un cuadradito de color.">
<meta name="theme-color" content="#faf4ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuadraditos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: una columna angosta pensada para el teléfono; barra de pestañas abajo; las cargas se abren en una hoja a pantalla completa */
:root {
  --bg: #faf4ea; --surface: #fffdf8; --surface-2: #efe7da; --ink: #2a2420; --ink-2: #5b524b; --muted: #8a8079;
  --line: #e6dccd; --accent: #2b6e57; --accent-ink: #ffffff; --accent-soft: #dcefe6; --warn-soft: #fbedc9;
  --c1: #d64545; --c2: #ec8a3a; --c3: #e8c23a; --c4: #8cc84b; --c5: #2f9e5b;
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #171513; --surface: #211e1b; --surface-2: #2e2a26; --ink: #f3ede4; --ink-2: #c4bab0; --muted: #948a81;
  --line: #3a352f; --accent: #6cc4a1; --accent-ink: #0f1f19; --accent-soft: #1d3a2f; --warn-soft: #3a2f12;
  color-scheme: dark; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); margin: 0; }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.brand { font-weight: 900; font-size: 24px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.logo { display: grid; grid-template-columns: repeat(2, 9px); gap: 2px; }
.logo i { width: 9px; height: 9px; border-radius: 2.5px; }
h2 { font-size: 20px; font-weight: 800; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 800; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
section { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.banner { background: var(--warn-soft); border-radius: 12px; padding: 10px 8px 10px 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.banner > span { flex: 1; }
button { font: 700 14px/1 var(--font); border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; cursor: pointer; min-height: 42px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
button.danger { color: var(--c1); }
button.icon { min-width: 42px; padding: 8px; font-size: 18px; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wide { width: 100%; }
input, textarea { font: 600 16px/1.3 var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 70px; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
label.check { display: flex; gap: 10px; align-items: center; font-weight: 600; }
label.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
nav.tabs button { flex: 1; max-width: 200px; border: 0; border-radius: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; min-height: 60px; font-size: 12px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs svg { width: 22px; height: 22px; }

/* hoy */
.daynav { display: flex; align-items: center; gap: 6px; }
.daynav .t { flex: 1; text-align: center; }
.daynav .icon { font-size: 28px; font-weight: 600; color: var(--ink); }
.daynav .t b { display: block; font-size: 19px; font-weight: 800; }
.daynav .t span { font-size: 13px; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.strip button { padding: 0; min-height: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 700; }
.strip .sq { width: 100%; aspect-ratio: 1; border-radius: 9px; }
.strip button[aria-current="date"] { color: var(--ink); }
.strip button[aria-current="date"] .sq { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-head h2 { display: flex; align-items: center; gap: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 700; background: var(--surface-2); }
.pill .dot { width: 10px; height: 10px; border-radius: 3px; }
.metric { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; font-size: 14px; }
.metric .lab { color: var(--muted); font-weight: 700; font-size: 13px; }
.minisq { display: flex; gap: 3px; align-items: center; }
.minisq i { width: 14px; height: 14px; border-radius: 4px; background: var(--surface-2); }
.minisq span { margin-left: 8px; font-weight: 700; }
.note { white-space: pre-wrap; font-size: 14px; color: var(--ink-2); border-left: 3px solid var(--line); padding-left: 10px; }
.empty { color: var(--muted); font-size: 14px; }

/* hoja de carga */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; overscroll-behavior: contain; }
.sheet .wrap { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.sheet-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: linear-gradient(transparent, var(--bg) 30%); padding: 22px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.sheet-foot .in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
.sheet-foot .primary { flex: 1; min-height: 50px; font-size: 16px; }

/* escala 1–5 de cuadraditos */
.scale { display: flex; flex-direction: column; gap: 10px; }
.scale-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.scale-head .q { font-weight: 800; font-size: 16px; }
.scale-head .w { font-weight: 800; font-size: 15px; color: var(--muted); white-space: nowrap; }
.squares { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; border-radius: 12px; }
.squares i { aspect-ratio: 1.25; border-radius: 10px; background: var(--surface-2); transition: background-color .15s, transform .15s; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--muted); font-size: 15px; }
.squares i.on { color: transparent; }
.squares i.cur { transform: scale(1.06); color: inherit; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 8px 13px; border-radius: 999px; font-weight: 700; font-size: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.act { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px 12px; min-height: 52px; border-radius: 12px; font-weight: 700; line-height: 1.2; }
.act .em { font-size: 20px; }
.act[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip .em { margin-right: 4px; }
.chip.act-on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.detail { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.detail b { font-size: 14px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 8px 12px; border-radius: 9px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
details.fam { border-bottom: 1px solid var(--line); }
details.fam summary { list-style: none; cursor: pointer; padding: 12px 2px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
details.fam summary::-webkit-details-marker { display: none; }
details.fam summary::after { content: "＋"; color: var(--muted); }
details.fam[open] summary::after { content: "－"; }
details.fam .chips { padding-bottom: 14px; }
.fam-count { font-size: 12px; color: var(--accent); margin-left: 6px; }

/* calendario */
.segbar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.segbar button { border: 0; background: none; min-height: 36px; border-radius: 9px; color: var(--ink-2); }
.segbar button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.month .dow { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
.month button { aspect-ratio: 1; min-height: 0; padding: 0; border: 0; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 14px; font-weight: 800; }
.month button.future { background: transparent; border: 1px dashed var(--line); opacity: .6; }
.month button.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.year { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }
.mini { display: flex; flex-direction: column; gap: 6px; border: 0; background: none; padding: 0; min-height: 0; text-align: left; border-radius: 6px; }
.mini b { font-size: 13px; font-weight: 800; }
.mini .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 100%; }
.mini .g i { aspect-ratio: 1; border-radius: 2.5px; background: var(--surface-2); }
.mini .g i.x { background: transparent; }
.week { display: flex; flex-direction: column; gap: 8px; }
.wrow { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; padding: 8px; border-radius: 14px; font-weight: 600; min-height: 0; }
.wrow .sq { width: 52px; height: 52px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; font-size: 18px; font-weight: 900; color: var(--muted); }
.wrow .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wrow .info b { font-weight: 800; }
.wrow .info span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); font-weight: 700; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.dist { display: flex; height: 14px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.dist i { display: block; height: 100%; }

/* ajustes */
.alist { display: flex; flex-direction: column; }
.arow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.arow .em { font-size: 20px; width: 28px; text-align: center; }
.arow .nm { flex: 1; min-width: 0; font-weight: 700; }
.arow .nm small { display: block; color: var(--muted); font-weight: 600; font-size: 12px; }
.arow button { min-height: 36px; min-width: 36px; padding: 6px; font-size: 15px; }
.aform { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.aform input.emo { text-align: center; font-size: 20px; padding: 6px; }
.aform .full { grid-column: 1 / -1; }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; z-index: 40; pointer-events: none; }
</style>
</head>
<body>
<div id="view" class="wrap"></div>
<nav class="tabs" id="tabs" aria-label="Secciones">
  <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Calendario</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div id="sheet" class="sheet" hidden></div>
<div id="foot" class="sheet-foot" hidden></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
/* ---------- constantes ---------- */
const KEY = 'cuadraditos-data', UIKEY = 'cuadraditos-ui';
const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
const INK_ON = ['#fff', '#2b1606', '#2e2405', '#1c2b0c', '#fff'];
const SCALES = {
  sleep:  { t: 'Sueño',   q: '¿Cómo dormiste?',            w: ['Pésimo', 'Mal', 'Regular', 'Bien', 'Excelente'] },
  mood:   { t: 'Ánimo',   q: '¿Cómo te levantaste?',       w: ['Muy mal', 'Mal', 'Normal', 'Bien', 'Muy bien'] },
  energy: { t: 'Energía', q: '¿Cuánta energía tenés?',     w: ['Nada', 'Poca', 'Normal', 'Bastante', 'A full'] },
  score:  { t: 'El día',  q: '¿Cómo te sentiste hoy, en general?', w: ['Muy mal', 'Mal', 'Normal', 'Bien', 'Muy bien'] },
};
const LEVELS = ['Poco', 'Medio', 'Mucho'];
const SLOTS = [['m', 'Mañana'], ['t', 'Tarde'], ['n', 'Noche']];
const FAMILIES = [
  ['Alegría', '☀️', ['Alegría', 'Felicidad', 'Entusiasmo', 'Gratitud', 'Orgullo', 'Optimismo', 'Diversión', 'Inspiración', 'Motivación', 'Esperanza', 'Satisfacción', 'Euforia', 'Ilusión']],
  ['Calma', '🌿', ['Paz', 'Tranquilidad', 'Relajación', 'Alivio', 'Seguridad', 'Plenitud', 'Comodidad', 'Claridad', 'Aceptación']],
  ['Conexión', '🤝', ['Amor', 'Cariño', 'Ternura', 'Compañía', 'Pertenencia', 'Confianza', 'Empatía', 'Deseo']],
  ['Tristeza', '🌧️', ['Tristeza', 'Desánimo', 'Melancolía', 'Nostalgia', 'Soledad', 'Decepción', 'Vacío', 'Dolor', 'Culpa', 'Vergüenza', 'Arrepentimiento', 'Desesperanza']],
  ['Miedo', '🌀', ['Ansiedad', 'Preocupación', 'Nervios', 'Inseguridad', 'Agobio', 'Estrés', 'Miedo', 'Tensión', 'Vulnerabilidad', 'Inquietud', 'Pánico']],
  ['Enojo', '🔥', ['Enojo', 'Bronca', 'Frustración', 'Irritabilidad', 'Impaciencia', 'Fastidio', 'Resentimiento', 'Celos', 'Envidia', 'Hartazgo']],
  ['Cansancio', '🌫️', ['Cansancio', 'Agotamiento', 'Sueño', 'Apatía', 'Aburrimiento', 'Desmotivación', 'Confusión', 'Distracción', 'Pereza', 'Indiferencia']],
  ['Sorpresa', '✨', ['Sorpresa', 'Curiosidad', 'Asombro', 'Desconcierto', 'Expectativa']],
];
const DEFAULT_ACTS = [
  ['trabajo', '💼', 'Trabajé'], ['entrene', '🏋️', 'Entrené'], ['amigos', '🍻', 'Amigos'], ['familia', '🏡', 'Familia'],
  ['pareja', '❤️', 'Pareja'], ['sano', '🥗', 'Comí sano'], ['chatarra', '🍔', 'Comida chatarra'],
  ['alcohol', '🍷', 'Alcohol', true], ['cafeina', '☕', 'Cafeína', true], ['pantallas', '📱', 'Pantallas de noche'],
  ['aire', '🌳', 'Aire libre'], ['leer', '📖', 'Leí'], ['ocio', '🛋️', 'Descanso / ocio'], ['tramites', '📋', 'Médico / trámites'],
].map(([id, emoji, name, detail]) => ({ id, emoji, name, detail: !!detail }));
const DOW = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
// Antes de las 5 de la mañana todavía cuenta como el día anterior (para cargar la noche tarde).
const today = () => { const d = new Date(); if (d.getHours() < 5) d.setDate(d.getDate() - 1); return keyOf(d); };
const mondayOf = k => { const d = dateOf(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return keyOf(d); };
const slotNow = () => { const hr = new Date().getHours(); return hr >= 5 && hr < 13 ? 'm' : hr >= 5 && hr < 20 ? 't' : 'n'; };
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function dayLabel(k) {
  const t = today(), d = dateOf(k);
  const rel = k === t ? 'Hoy' : k === addDays(t, -1) ? 'Ayer' : cap(DOW[d.getDay()]);
  const full = `${DOW[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}` + (d.getFullYear() !== new Date().getFullYear() ? ` de ${d.getFullYear()}` : '');
  return { rel, full };
}

/* ---------- datos ---------- */
let data = load();
let ui = Object.assign({ backupHideUntil: 0 }, lsGet(UIKEY));
let state = { tab: 'hoy', date: today(), calMode: 'mes', calAnchor: today(), editAct: null, actsOpen: false };
let sheet = null; // { kind: 'morning' | 'night', date, draft, search, open }

function load() {
  const d = lsGet(KEY);
  if (d && d.days && Array.isArray(d.acts)) return migrate(d);
  return { v: 2, acts: DEFAULT_ACTS.map(a => ({ ...a })), days: {}, lastBackup: null };
}
// v1 guardaba las actividades dentro de la noche; desde v2 son del día y se cargan en cualquier momento.
function migrate(d) {
  for (const day of Object.values(d.days)) {
    if (day.night?.acts) { day.acts = { ...day.night.acts, ...day.acts }; delete day.night.acts; }
    if (day.acts && !Object.keys(day.acts).length) delete day.acts;
  }
  d.v = 2;
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch { toast('No se pudo guardar. ¿Poco espacio en el teléfono?'); return false; }
}
const dayColor = day => day?.night?.score ?? day?.morning?.mood ?? null;
const actById = id => data.acts.find(a => a.id === id);
const loggedDays = () => Object.keys(data.days);

function emotionUse() {
  const n = {};
  for (const d of Object.values(data.days)) for (const e of d.morning?.emotions || []) n[e] = (n[e] || 0) + 1;
  return n;
}

/* ---------- piezas ---------- */
function minisq(v) {
  if (v == null) return '<span class="muted">—</span>';
  let s = '<span class="minisq">';
  for (let i = 1; i <= 5; i++) s += `<i style="${i <= v ? `background:${COLORS[v - 1]}` : ''}"></i>`;
  return s + '</span>';
}
function metric(scale, v) {
  return `<div class="metric"><span class="lab">${SCALES[scale].t}</span><span class="row" style="gap:0">${minisq(v)}${v ? `<span style="margin-left:10px;font-weight:700">${SCALES[scale].w[v - 1]}</span>` : ''}</span></div>`;
}
function actText(id, val) {
  const a = actById(id) || { emoji: '•', name: '(actividad borrada)' };
  let extra = [];
  if (val?.lvl) extra.push(LEVELS[val.lvl - 1].toLowerCase());
  if (val?.slots?.length) extra.push(val.slots.map(s => SLOTS.find(x => x[0] === s)[1].toLowerCase()).join(' y '));
  return `${a.emoji} ${a.name}${extra.length ? ' · ' + extra.join(' · ') : ''}`;
}
function squareStyle(v) { return v ? `background:${COLORS[v - 1]};color:${INK_ON[v - 1]}` : ''; }
function legend() {
  return `<div class="legend">${SCALES.score.w.map((w, i) => `<span><i style="background:${COLORS[i]}"></i>${w}</span>`).join('')}<span><i style="background:var(--surface-2)"></i>Sin datos</span></div>`;
}

/* ---------- pestaña Hoy ---------- */
function renderHoy() {
  const k = state.date, t = today(), day = data.days[k] || {}, { rel, full } = dayLabel(k);
  const end = k > addDays(t, -7) ? t : addDays(k, 3);
  let strip = '';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(end, -i);
    strip += `<button data-go="${d}" ${d === k ? 'aria-current="date"' : ''} aria-label="${h(dayLabel(d).full)}"><span class="sq" style="${squareStyle(dayColor(data.days[d])) || 'background:var(--surface-2)'}"></span>${DOW[dateOf(d).getDay()].slice(0, 2)}</button>`;
  }
  const m = day.morning, n = day.night;
  const morningFirst = !m;
  const showBackup = loggedDays().length >= 7 && (!data.lastBackup || Date.now() - data.lastBackup > 14 * 864e5) && Date.now() > ui.backupHideUntil;

  return `
  <header class="top"><div class="brand"><span class="logo"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c4)"></i><i style="background:var(--c5)"></i></span>Cuadraditos</div></header>
  ${showBackup ? `<div class="banner"><span>Hace un tiempo que no guardás una copia de tus datos.</span><button data-act="backup">Guardar copia</button><button class="ghost icon" data-act="hide-backup" aria-label="Cerrar">✕</button></div>` : ''}
  <section>
    <div class="daynav">
      <button class="ghost icon" data-go="${addDays(k, -1)}" aria-label="Día anterior">‹</button>
      <div class="t"><b>${rel}</b><span>${full}</span></div>
      <button class="ghost icon" data-go="${addDays(k, 1)}" aria-label="Día siguiente" ${k >= t ? 'disabled' : ''}>›</button>
    </div>
    <div class="strip">${strip}</div>
  </section>

  <div class="card">
    <div class="card-head"><h2>🌅 Mañana</h2>${m ? '<button class="ghost" data-open="morning">Editar</button>' : ''}</div>
    ${m ? `
      ${m.emotions?.length ? `<div class="pills">${m.emotions.map(e => `<span class="pill">${h(e)}</span>`).join('')}</div>` : ''}
      <div>${metric('mood', m.mood)}${metric('energy', m.energy)}${metric('sleep', m.sleep)}</div>
    ` : `<p class="empty" style="margin:0">¿Cómo te levantaste? Emociones, ánimo, energía y sueño.</p>
         <button class="${morningFirst ? 'primary' : ''}" data-open="morning">Cargar la mañana</button>`}
  </div>

  <div id="day-acts">${dayActsHtml()}</div>

  <div class="card">
    <div class="card-head"><h2>🌙 Noche</h2>${n ? '<button class="ghost" data-open="night">Editar</button>' : ''}</div>
    ${n ? `
      ${n.score ? metric('score', n.score) : ''}
      ${n.note ? `<div class="note">${h(n.note)}</div>` : ''}
    ` : `<p class="empty" style="margin:0">¿Cómo te sentiste en el día, en general?</p>
         <button class="${!morningFirst ? 'primary' : ''}" data-open="night">Cargar la noche</button>`}
  </div>`;
}

/* ---------- pestaña Calendario ---------- */
function renderCal() {
  const mode = state.calMode, a = dateOf(state.calAnchor);
  let title, body;
  if (mode === 'semana') {
    const mon = mondayOf(state.calAnchor), sun = addDays(mon, 6);
    const dm = dateOf(mon), ds = dateOf(sun);
    title = dm.getMonth() === ds.getMonth() ? `${dm.getDate()} al ${ds.getDate()} de ${MONTHS[ds.getMonth()]}` : `${dm.getDate()} ${MONTHS[dm.getMonth()].slice(0, 3)} – ${ds.getDate()} ${MONTHS[ds.getMonth()].slice(0, 3)}`;
    body = '<div class="week">';
    for (let i = 0; i < 7; i++) {
      const k = addDays(mon, i), day = data.days[k], v = dayColor(day), d = dateOf(k);
      const bits = [];
      if (day?.morning?.emotions?.length) bits.push(day.morning.emotions.slice(0, 3).join(', '));
      if (day?.acts) bits.push(Object.keys(day.acts).map(id => actById(id)?.emoji || '•').join(' '));
      body += `<button class="wrow" data-day="${k}" ${k > today() ? 'disabled' : ''}>
        <span class="sq" style="${squareStyle(v)}">${d.getDate()}</span>
        <span class="info"><b>${cap(DOW[d.getDay()])}${v ? ` · ${SCALES.score.w[v - 1]}` : ''}</b><span>${h(bits.join(' · ')) || (k > today() ? '' : 'Sin datos')}</span></span>
      </button>`;
    }
    body += '</div>';
  } else if (mode === 'mes') {
    title = `${cap(MONTHS[a.getMonth()])} ${a.getFullYear()}`;
    body = `<div class="month">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span class="dow">${x}</span>`).join('')}${monthCells(a.getFullYear(), a.getMonth())}</div>`;
    body += stats(monthKeys(a.getFullYear(), a.getMonth()));
  } else {
    title = String(a.getFullYear());
    body = '<div class="year">';
    for (let mo = 0; mo < 12; mo++) {
      const first = new Date(a.getFullYear(), mo, 1), lead = (first.getDay() + 6) % 7;
      let cells = '<i class="x"></i>'.repeat(lead);
      for (const k of monthKeys(a.getFullYear(), mo)) { const v = dayColor(data.days[k]); cells += `<i style="${v ? `background:${COLORS[v - 1]}` : ''}"></i>`; }
      body += `<button class="mini" data-month="${mo}"><b>${cap(MONTHS[mo]).slice(0, 3)}</b><span class="g">${cells}</span></button>`;
    }
    body += '</div>';
    const keys = []; for (let mo = 0; mo < 12; mo++) keys.push(...monthKeys(a.getFullYear(), mo));
    body += stats(keys);
  }
  return `
  <header class="top"><h2 style="font-size:24px;font-weight:900">Calendario</h2></header>
  <div class="segbar">${[['semana', 'Semana'], ['mes', 'Mes'], ['ano', 'Año']].map(([m, l]) => `<button data-mode="${m}" aria-pressed="${mode === m}">${l}</button>`).join('')}</div>
  <div class="daynav">
    <button class="ghost icon" data-shift="-1" aria-label="Anterior">‹</button>
    <div class="t"><b>${h(title)}</b></div>
    <button class="ghost icon" data-shift="1" aria-label="Siguiente">›</button>
  </div>
  ${body}
  ${legend()}`;
}
function monthKeys(y, m) { const n = new Date(y, m + 1, 0).getDate(), out = []; for (let d = 1; d <= n; d++) out.push(keyOf(new Date(y, m, d))); return out; }
function monthCells(y, m) {
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, t = today();
  let s = '<span></span>'.repeat(lead);
  for (const k of monthKeys(y, m)) {
    const v = dayColor(data.days[k]);
    s += `<button data-day="${k}" class="${k > t ? 'future' : ''} ${k === t ? 'today' : ''}" style="${squareStyle(v)}" ${k > t ? 'disabled' : ''} aria-label="${h(dayLabel(k).full)}${v ? ': ' + SCALES.score.w[v - 1] : ''}">${dateOf(k).getDate()}</button>`;
  }
  return s;
}
function stats(keys) {
  const vals = keys.map(k => dayColor(data.days[k])).filter(v => v != null);
  if (!vals.length) return '<p class="empty">Todavía no hay días cargados en este período.</p>';
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length, cnt = [0, 0, 0, 0, 0];
  vals.forEach(v => cnt[v - 1]++);
  return `<div class="card" style="gap:10px">
    <div class="row between"><span><b>${vals.length}</b> <span class="muted">días con color</span></span><span><span class="muted">promedio</span> <b>${avg.toFixed(1).replace('.', ',')}</b></span></div>
    <div class="dist">${cnt.map((c, i) => c ? `<i style="width:${c / vals.length * 100}%;background:${COLORS[i]}" title="${SCALES.score.w[i]}: ${c}"></i>` : '').join('')}</div>
    <div class="legend">${cnt.map((c, i) => c ? `<span><i style="background:${COLORS[i]}"></i>${SCALES.score.w[i]}: ${c}</span>` : '').join('')}</div>
  </div>`;
}

/* ---------- pestaña Ajustes ---------- */
function renderAjustes() {
  const active = data.acts.filter(a => !a.hidden), hidden = data.acts.filter(a => a.hidden);
  const form = a => `<div class="aform">
      <input class="emo" id="f-emoji" value="${h(a?.emoji || '⭐')}" aria-label="Emoji" maxlength="8">

  </section>
  ${hidden.length ? `<section><h3>Quitadas</h3><p class="small muted" style="margin:0">Siguen en tu historial. Podés volver a mostrarlas.</p>
    <div class="alist">${hidden.map(a => `<div class="arow"><span class="em">${h(a.emoji)}</span><span class="nm">${h(a.name)}</span><button data-show="${a.id}">Volver a mostrar</button></div>`).join('')}</div></section>` : ''}
  <section>
    <h3>Tus datos</h3>
    <div class="card">
      <p style="margin:0">Todo queda guardado <b>solo en este teléfono</b>. Llevás <b>${n}</b> ${n === 1 ? 'día cargado' : 'días cargados'}.</p>
      <p class="small muted" style="margin:0">${data.lastBackup ? `Última copia: ${new Date(data.lastBackup).toLocaleDateString('es-AR')}.` : 'Todavía no guardaste ninguna copia.'} Si borrás la app o los datos del navegador sin una copia, se pierde todo.</p>
      <div class="row"><button class="primary" data-act="backup">Guardar copia</button><button data-act="restore">Restaurar copia</button></div>
    </div>

/* ---------- hojas de carga ---------- */
function openSheet(kind, date) {
  const day = data.days[date] || {};
  const draft = kind === 'morning'
    ? { emotions: [...(day.morning?.emotions || [])], mood: day.morning?.mood ?? null, energy: day.morning?.energy ?? null, sleep: day.morning?.sleep ?? null }
    : { acts: structuredClone(day.acts || {}), score: day.night?.score ?? null, note: day.night?.note || '' };
  sheet = { kind, date, draft, search: '', open: new Set(), existed: !!day[kind] };
  renderSheet();
  $('#sheet').hidden = $('#foot').hidden = false;
  $('#sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({ sheet: 1 }, '');
}
function closeSheet(fromHistory) {
  if (!sheet) return;
  sheet = null;
  $('#sheet').hidden = $('#foot').hidden = true;
  $('#sheet').innerHTML = $('#foot').innerHTML = '';
  document.body.style.overflow = '';
  if (!fromHistory && history.state?.sheet) history.back();
  render();
}
addEventListener('popstate', () => closeSheet(true));

function scaleHtml(name, v) {
  const s = SCALES[name];
  return `<div class="scale" data-scale="${name}">
    <div class="scale-head"><span class="q">${s.q}</span><span class="w"></span></div>
    <div class="squares" role="slider" tabindex="0" aria-label="${s.t}" aria-valuemin="1" aria-valuemax="5">${'<i></i>'.repeat(5)}</div>
  </div>`;
}
function paintScale(el) {
  const name = el.dataset.scale, v = sheet.draft[name], w = el.querySelector('.w');
  el.querySelectorAll('.squares i').forEach((sq, i) => {
    sq.className = v && i < v ? 'on' : '';
    if (v && i === v - 1) sq.classList.add('cur');
    sq.style.background = v && i < v ? COLORS[v - 1] : '';
    sq.textContent = i + 1;
  });
  w.textContent = v ? SCALES[name].w[v - 1] : 'Tocá o deslizá';
  w.style.color = v ? COLORS[v - 1] : '';
  const sl = el.querySelector('.squares');
  sl.setAttribute('aria-valuenow', v || '');
  sl.setAttribute('aria-valuetext', v ? `${v}: ${SCALES[name].w[v - 1]}` : 'Sin elegir');
}

function renderSheet() {
  const { kind, date, draft } = sheet, { rel, full } = dayLabel(date);
  const head = `<header class="top"><button class="ghost" data-act="close">‹ Volver</button><span class="small muted">${rel === 'Hoy' ? cap(full) : `${rel} · ${full}`}</span></header>`;
  let body;
  if (kind === 'morning') {
    body = `<h2 style="font-size:24px">🌅 ¿Cómo arrancás el día?</h2>
      <div class="card">${scaleHtml('mood')}</div>
      <div class="card">${scaleHtml('energy')}</div>
      <div class="card">${scaleHtml('sleep')}</div>
      <section><h3>¿Qué emociones sentís?</h3>
        <input type="search" id="emo-search" placeholder="Buscar emoción…" value="${h(sheet.search)}" autocomplete="off">
        <div id="emo-box"></div>
      </section>`;
  } else {
    body = `<h2 style="font-size:24px">🌙 ¿Cómo fue tu día?</h2>
      <div class="card">${scaleHtml('score')}</div>
      <section><h3>¿Qué hiciste hoy?</h3><p class="small muted" style="margin:0">Revisá si te faltó marcar algo.</p><div id="acts-box"></div></section>
      <section><h3>Nota (opcional)</h3><textarea id="note" placeholder="Algo que quieras recordar de hoy…" maxlength="2000">${h(draft.note)}</textarea></section>`;
  }
  $('#sheet').innerHTML = `<div class="wrap">${head}${body}${sheet.existed ? '<button class="ghost danger" data-act="delete-entry">Borrar este registro</button>' : ''}</div>`;
  $('#foot').innerHTML = `<div class="in"><button class="primary" data-act="save-sheet">Guardar</button></div>`;
  $('#sheet').querySelectorAll('.scale').forEach(paintScale);
  if (kind === 'morning') renderEmotions(); else renderActs();
  updateSave();
}
function updateSave() {
  const d = sheet.draft;
  const any = sheet.kind === 'morning' ? (d.mood || d.energy || d.sleep || d.emotions.length) : (d.score || Object.keys(d.acts).length || d.note.trim());
  $('#foot .primary').disabled = !any;
}

function renderEmotions() {
  const sel = sheet.draft.emotions, q = norm(sheet.search.trim());
  const chip = e => `<button class="chip" data-emo="${h(e)}" aria-pressed="${sel.includes(e)}">${h(e)}</button>`;
  let s = '';
  if (sel.length) s += `<div class="chips" style="margin-bottom:12px">${sel.map(chip).join('')}</div>`;
  if (q) {
    const all = FAMILIES.flatMap(f => f[2]).filter(e => norm(e).includes(q));
    s += all.length ? `<div class="chips">${all.map(chip).join('')}</div>` : '<p class="empty">No hay ninguna con ese nombre.</p>';
  } else {
    const use = emotionUse(), top = Object.keys(use).sort((a, b) => use[b] - use[a]).filter(e => !sel.includes(e)).slice(0, 8);
    if (top.length) s += `<p class="small muted" style="margin:4px 0 8px;font-weight:700">Las que más usás</p><div class="chips" style="margin-bottom:8px">${top.map(chip).join('')}</div>`;
    s += FAMILIES.map(([name, em, list]) => {
      const n = list.filter(e => sel.includes(e)).length;
      return `<details class="fam" data-fam="${name}" ${sheet.open.has(name) ? 'open' : ''}><summary><span>${em} ${name}${n ? `<span class="fam-count">${n} ✓</span>` : ''}</span></summary><div class="chips">${list.map(chip).join('')}</div></details>`;
    }).join('');
  }
  $('#emo-box').innerHTML = s;
}

function renderActs() {
  $('#acts-box').innerHTML = actsHtml(sheet.draft.acts) + `<p class="small muted" style="margin:10px 0 0">Podés cambiar esta lista en Ajustes.</p>`;
}
// Hoy: solo las actividades marcadas y un botón que despliega la lista completa.
function dayActsHtml() {
  const d = data.days[state.date]?.acts || {}, any = Object.keys(d).length;
  if (state.actsOpen) return `<div class="card">${actsHtml(d, true)}<button class="primary" data-act="acts-close">Listo</button></div>`;
  const add = `<button class="wide" data-act="acts-open">＋ Agregar actividad</button>`;
  return any ? `<div class="card">${actsHtml(d, true, true)}${add}</div>` : add;
}
// compact: chips chicas para la pantalla Hoy; si no, botones grandes para la hoja de la noche.
function actsHtml(d, compact, onlyMarked) {
  const list = data.acts.filter(a => onlyMarked ? d[a.id] : !a.hidden || d[a.id]);
  let s = compact
    ? `<div class="chips">${list.map(a => `<button class="chip ${d[a.id] ? 'act-on' : ''}" data-actid="${a.id}" aria-pressed="${!!d[a.id]}"><span class="em">${h(a.emoji)}</span>${h(a.name)}</button>`).join('')}</div>`
    : `<div class="acts">${list.map(a => `<button class="act" data-actid="${a.id}" aria-pressed="${!!d[a.id]}"><span class="em">${h(a.emoji)}</span>${h(a.name)}</button>`).join('')}</div>`;
  for (const a of list.filter(a => a.detail && d[a.id])) {
    const v = d[a.id];
    s += `<div class="detail" style="margin-top:8px"><b>${h(a.emoji)} ${h(a.name)}</b>
      <div class="seg">${LEVELS.map((l, i) => `<button data-lvl="${a.id}:${i + 1}" aria-pressed="${v.lvl === i + 1}">${l}</button>`).join('')}</div>
      <div class="seg">${SLOTS.map(([k, l]) => `<button data-slot="${a.id}:${k}" aria-pressed="${!!v.slots?.includes(k)}">${l}</button>`).join('')}</div>
    </div>`;
  }
  return s;
}

function saveSheet() {
  const { kind, date, draft } = sheet;
  const day = data.days[date] || (data.days[date] = {});
  if (kind === 'morning') day.morning = { ...draft, at: Date.now() };
  else {
    if (Object.keys(draft.acts).length) day.acts = draft.acts; else delete day.acts;
    if (draft.score || draft.note.trim()) day.night = { score: draft.score, note: draft.note.trim(), at: Date.now() };
    else delete day.night;
    if (!day.morning && !day.night && !day.acts) delete data.days[date];
  }
  if (save()) { toast('Guardado'); closeSheet(); }
}

/* ---------- interacción con la escala ---------- */
function scaleFromPointer(e) {
  const sq = e.target.closest('.squares'); if (!sq) return;
  const r = sq.getBoundingClientRect();
  const v = Math.min(5, Math.max(1, Math.ceil((e.clientX - r.left) / r.width * 5)));
  setScale(sq.closest('.scale'), v);
}
function setScale(el, v) {
  if (sheet.draft[el.dataset.scale] === v) return;
  sheet.draft[el.dataset.scale] = v;
  paintScale(el);
  updateSave();
  navigator.vibrate?.(8);
}
let dragging = null;
$('#sheet').addEventListener('pointerdown', e => {
  const sq = e.target.closest('.squares'); if (!sq) return;
  dragging = sq; sq.setPointerCapture(e.pointerId); scaleFromPointer(e);
});
$('#sheet').addEventListener('pointermove', e => { if (dragging) scaleFromPointer(e); });
addEventListener('pointerup', () => dragging = null);
addEventListener('pointercancel', () => dragging = null);
$('#sheet').addEventListener('keydown', e => {
  const sq = e.target.closest('.squares'); if (!sq) return;
  const el = sq.closest('.scale'), v = sheet.draft[el.dataset.scale] || 0;
  const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
  if (d) { e.preventDefault(); setScale(el, Math.min(5, Math.max(1, v + d))); }
  else if (/^[1-5]$/.test(e.key)) setScale(el, +e.key);
});
$('#sheet').addEventListener('input', e => {
  if (e.target.id === 'emo-search') { sheet.search = e.target.value; renderEmotions(); }
  if (e.target.id === 'note') { sheet.draft.note = e.target.value; updateSave(); }
});
$('#sheet').addEventListener('toggle', e => {
  const f = e.target.dataset?.fam; if (!f) return;
  e.target.open ? sheet.open.add(f) : sheet.open.delete(f);
}, true);

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const ds = b.dataset;
  if (ds.tab) { state.tab = ds.tab; state.editAct = null; state.actsOpen = false; render(); scrollTo(0, 0); return; }
  if (ds.go) { state.actsOpen = false; state.date = ds.go > today() ? today() : ds.go; render(); return; }
  if (ds.open) { openSheet(ds.open, state.date); return; }
  if (ds.day) { state.actsOpen = false; state.date = ds.day; state.tab = 'hoy'; render(); scrollTo(0, 0); return; }
  if (ds.mode) { state.calMode = ds.mode; render(); return; }
  if (ds.month) { const a = dateOf(state.calAnchor); state.calAnchor = keyOf(new Date(a.getFullYear(), +ds.month, 1)); state.calMode = 'mes'; render(); return; }
  if (ds.shift) { shiftCal(+ds.shift); return; }
  if (ds.emo) {
    const sel = sheet.draft.emotions, i = sel.indexOf(ds.emo);
    i >= 0 ? sel.splice(i, 1) : sel.push(ds.emo);
    renderEmotions(); updateSave(); return;
  }
  if (ds.actid || ds.lvl || ds.slot) {
    const date = sheet ? sheet.date : state.date;
    const d = sheet ? sheet.draft.acts : (data.days[date]?.acts || {});
    if (ds.actid) {
      const a = actById(ds.actid);
      if (d[ds.actid]) delete d[ds.actid]; else d[ds.actid] = a?.detail ? { lvl: 1, slots: date === today() ? [slotNow()] : [] } : {};
    } else if (ds.lvl) { const [id, l] = ds.lvl.split(':'); d[id].lvl = +l; }
    else {
      const [id, s] = ds.slot.split(':'), v = d[id], sl = v.slots || [];
      v.slots = SLOTS.map(x => x[0]).filter(x => x === s ? !sl.includes(x) : sl.includes(x));
    }
    if (sheet) { renderActs(); updateSave(); return; }
    // En Hoy se guarda al instante.
    const day = data.days[date] || (data.days[date] = {});
    if (Object.keys(d).length) day.acts = d; else delete day.acts;
    if (!day.morning && !day.night && !day.acts) delete data.days[date];
    save(); $('#day-acts').innerHTML = dayActsHtml(); return;
  }
  if (ds.up || ds.down) { moveAct(ds.up || ds.down, ds.up ? -1 : 1); return; }
  if (ds.edit) { state.editAct = ds.edit; render(); $('#f-name')?.focus(); return; }
  if (ds.hide) { actById(ds.hide).hidden = true; save(); render(); toast('Actividad quitada'); return; }
  if (ds.show) { actById(ds.show).hidden = false; save(); render(); return; }
  switch (ds.act) {
    case 'close': closeSheet(); break;
    case 'save-sheet': saveSheet(); break;
    case 'delete-entry':
      if (confirm(`¿Borrar el registro de ${sheet.kind === 'morning' ? 'la mañana' : 'la noche'}?`)) {
        const day = data.days[sheet.date]; delete day[sheet.kind];
        if (!day.morning && !day.night && !day.acts) delete data.days[sheet.date];
        save(); closeSheet(); toast('Borrado');
      }
      break;
    case 'acts-open': state.actsOpen = true; $('#day-acts').innerHTML = dayActsHtml(); break;
    case 'acts-close': state.actsOpen = false; $('#day-acts').innerHTML = dayActsHtml(); break;
    case 'new-act': state.editAct = 'new'; render(); $('#f-name')?.focus(); break;
    case 'cancel-act': state.editAct = null; render(); break;
    case 'save-act': saveAct(); break;
    case 'backup': backup(); break;
    case 'restore': $('#file').click(); break;
    case 'hide-backup': ui.backupHideUntil = Date.now() + 7 * 864e5; lsSet(UIKEY, ui); render(); break;
  }
});

function shiftCal(dir) {
  const a = dateOf(state.calAnchor);
  if (state.calMode === 'semana') state.calAnchor = addDays(state.calAnchor, 7 * dir);
  else if (state.calMode === 'mes') state.calAnchor = keyOf(new Date(a.getFullYear(), a.getMonth() + dir, 1));
  else state.calAnchor = keyOf(new Date(a.getFullYear() + dir, 0, 1));
  render();
}
function moveAct(id, dir) {
  const vis = data.acts.filter(a => !a.hidden), i = vis.findIndex(a => a.id === id), j = i + dir;
  if (j < 0 || j >= vis.length) return;
  const ai = data.acts.indexOf(vis[i]), aj = data.acts.indexOf(vis[j]);
  [data.acts[ai], data.acts[aj]] = [data.acts[aj], data.acts[ai]];
  save(); render();
}
function saveAct() {
  const name = $('#f-name').value.trim(), emoji = $('#f-emoji').value.trim() || '⭐', detail = $('#f-detail').checked;
  if (!name) { $('#f-name').focus(); return; }
  if (state.editAct === 'new') data.acts.push({ id: 'a' + Date.now().toString(36), emoji, name, detail });
  else Object.assign(actById(state.editAct), { emoji, name, detail });
  state.editAct = null; save(); render();
}

/* ---------- copias de seguridad ---------- */
function backup() {
  data.lastBackup = Date.now(); save();
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `cuadraditos-${keyOf(new Date())}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  render(); toast('Copia descargada');
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d.days !== 'object' || !Array.isArray(d.acts)) throw 0;
    const n = Object.keys(d.days).length;
    if (!confirm(`Esta copia tiene ${n} días. Va a reemplazar todo lo que hay ahora en la app. ¿Seguir?`)) return;
    data = migrate(d); save(); state.date = today(); render(); toast('Copia restaurada');
  } catch { alert('Ese archivo no parece una copia de Cuadraditos.'); }
});

/* ---------- general ---------- */
let toastT;
function toast(msg) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.append(t); toastT = setTimeout(() => t.remove(), 1800);
}
function render() {
  $('#view').innerHTML = state.tab === 'hoy' ? renderHoy() : state.tab === 'cal' ? renderCal() : renderAjustes();
  document.querySelectorAll('#tabs button').forEach(b => b.dataset.tab === state.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
}
// Si la app queda abierta de un día para el otro, "hoy" se actualiza al volver.
let lastToday = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && today() !== lastToday) { if (state.date === lastToday) state.date = today(); lastToday = today(); if (!sheet) render(); }
});

navigator.storage?.persist?.().catch(() => {});
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
